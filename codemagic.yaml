# Codemagic CI/CD — Halal Map Polskie (Flutter, iOS + Android)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Workflows:
#   - test             : analyze + unit/widget tests on PRs
#   - ios-testflight   : signed iOS build → TestFlight (ASC API key integration)
#   - ios-unsigned     : legacy unsigned .ipa for Sideloadly (pre-paid-team path)
#   - android-internal : signed .aab → Google Play internal testing track
#
# SHARED ONE-TIME SETUP in the Codemagic UI:
#   1. Connect this repo (git@github.com:MuayyadAH/halal-mapa-polskie.git).
#   2. Environment variables → group `halalmap_secrets`:
#        MAP_TILES_KEY = <your MapTiler key>   (mark "Secure")
#      (Optional, only when you have real values: SUGGEST_FORM_URL, WEBSITE_URL,
#       PRIVACY_URL, TERMS_URL — they have placeholder defaults otherwise.)

definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 60

workflows:
  # ---------------------------------------------------------------------------
  # Analyze + unit/widget tests (no signing, no device).
  # ---------------------------------------------------------------------------
  test:
    <<: *instance
    name: Analyze & Test
    environment:
      flutter: stable
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Analyze
        script: flutter analyze
      - name: Unit + widget tests
        script: flutter test

  # ---------------------------------------------------------------------------
  # iOS signed build → TestFlight, via the App Store Connect API key.
  # Automatic code signing + built-in TestFlight publishing.
  # Manual start only (no triggering block) so uploads are deliberate.
  #
  # ONE-TIME SETUP in the Codemagic UI:
  #   1. Integrations → Developer Portal (App Store Connect) → add key,
  #      reference name: halalmap-asc-key (Issuer ID + Key ID + .p8).
  #   2. Code signing identities → iOS certificates → GENERATE CERTIFICATE
  #      (via the halalmap-asc-key integration, type: iOS Distribution).
  #      Required: automatic signing only uses certificates whose private key
  #      Codemagic holds. The team's pre-existing cert is the previous
  #      developer's Expo-created one (no key available), so without a
  #      Codemagic-held certificate the build fails with
  #      "No matching profiles found".
  #
  # AFTER THE FIRST UPLOAD: in ASC → TestFlight, add yourself/testers to an
  # Internal Testing group (instant, no review) and install via the TestFlight
  # app on the iPhone. Each new upload needs a higher build number (bump the
  # +N in pubspec.yaml `version:`).
  # ---------------------------------------------------------------------------
  ios-testflight:
    <<: *instance
    name: iOS (TestFlight)
    integrations:
      app_store_connect: halalmap-asc-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pl.kolektywmuzulmanow.halalmapapolski
      groups:
        - halalmap_secrets       # provides MAP_TILES_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Apply signing settings to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          flutter build ipa --release \
            --dart-define=MAP_TILES_KEY=$MAP_TILES_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:           # uncomment to auto-distribute to a group
        #   - Internal Testers
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------------
  # iOS unsigned build → downloadable .ipa for Sideloadly/AltStore.
  # Legacy path from before the paid Apple team; kept for quick personal
  # sideloads. No Apple account, no code signing, no publishing.
  # ---------------------------------------------------------------------------
  ios-unsigned:
    <<: *instance
    name: iOS (unsigned, for Sideloadly)
    environment:
      groups:
        - halalmap_secrets       # provides MAP_TILES_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: 004-profile-screen
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build unsigned .app
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=MAP_TILES_KEY=$MAP_TILES_KEY
      - name: Package unsigned .ipa (Payload/Runner.app)
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r9 "$CM_BUILD_DIR/Runner-unsigned.ipa" Payload
    artifacts:
      - Runner-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------------
  # Android signed .aab → Google Play internal testing track.
  # Manual start only (no triggering block) so uploads are deliberate.
  #
  # ONE-TIME SETUP:
  #   1. Codemagic UI → Code signing identities → Android keystores → upload
  #      the upload keystore, reference name: halalmap_upload_keystore
  #      (BLOCKED until the keystore arrives from the devs — the Play listing
  #      already exists, so we must sign with ITS registered upload key.)
  #   2. Google Play service account for API publishing:
  #        - Google Cloud console → create a service account + JSON key
  #        - Play Console → Users and permissions → invite the service
  #          account email with "Release to testing tracks" permission
  #        - Codemagic UI → Environment variables → group `halalmap_google_play`:
  #            GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = <paste JSON>  (mark "Secure")
  #      (The app already has an upload — v0.1.0 by the previous devs — so
  #       API publishing works immediately; no manual first upload needed.)
  #
  # Each Play upload needs a higher versionCode (bump the +N in pubspec.yaml;
  # Play's highest is 2, current pubspec 0.2.0+4 clears it).
  #
  # INTERIM (no keystore yet): Play Console → Internal app sharing accepts ANY
  # signature, including the debug-key fallback — usable for device testing
  # today without the upload keystore.
  # ---------------------------------------------------------------------------
  android-internal:
    name: Android (Play internal testing)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - halalmap_upload_keystore
      groups:
        - halalmap_secrets       # provides MAP_TILES_KEY
        - halalmap_google_play   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Write android/key.properties from the Codemagic keystore
        # android/app/build.gradle.kts reads key.properties; Codemagic exposes
        # the uploaded keystore via CM_KEYSTORE_* environment variables.
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build signed .aab
        script: |
          flutter build appbundle --release \
            --dart-define=MAP_TILES_KEY=$MAP_TILES_KEY
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Draft = review and roll out in Play Console yourself; set to false
        # to release straight to the internal-tester list.
        submit_as_draft: true
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
