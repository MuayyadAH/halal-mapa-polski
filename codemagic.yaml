# Codemagic CI/CD — Halal Map Polskie (Flutter, iOS + Android)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Workflows:
#   - test             : analyze + unit/widget tests, auto-runs on PRs
#   - ios-testflight   : signed iOS build → TestFlight, manual start
#   - android-internal : signed .aab → Play internal testing, manual start
#
# ONE-TIME SETUP in the Codemagic UI (see each workflow's comment):
#   - App settings → Environment variables → group `halalmap_secrets`:
#       MAP_TILES_KEY = <MapTiler key>  (Secure)
#   - Integrations → Developer Portal → App Store Connect key, reference
#     name `halalmap-asc-key`
#   - Code signing identities → iOS certificates → one generated certificate
#     (required by automatic signing: it only signs with a certificate whose
#     private key Codemagic stores)

definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 60

workflows:
  # ---------------------------------------------------------------------------
  # Analyze + unit/widget tests (no signing, no device). Auto-runs on PRs only.
  # ---------------------------------------------------------------------------
  test:
    <<: *instance
    name: Analyze & Test
    environment:
      flutter: stable
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Analyze
        script: flutter analyze
      - name: Unit + widget tests
        script: flutter test
  # ---------------------------------------------------------------------------
  # iOS signed build → TestFlight. Automatic code signing via the
  # `halalmap-asc-key` App Store Connect integration; requires one generated
  # certificate under Code signing identities (see header). Manual start only.
  #
  # After each upload: bump the +N in pubspec.yaml `version:` before the next
  # one. Testers are managed in ASC → TestFlight → Internal Testing.
  # ---------------------------------------------------------------------------
  ios-testflight:
    <<: *instance
    name: iOS (TestFlight)
    integrations:
      app_store_connect: halalmap-asc-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pl.kolektywmuzulmanow.halalmapapolski
      groups:
        - halalmap_secrets       # provides MAP_TILES_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Apply signing settings to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          flutter build ipa --release \
            --dart-define=MAP_TILES_KEY=$MAP_TILES_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:           # uncomment to auto-distribute to a group
        #   - Internal Testers
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
  # ---------------------------------------------------------------------------
  # Android signed .aab → Google Play internal testing track. Manual start.
  # BLOCKED on the upload keystore (waiting on the upload-key reset by the
  # Play account owner). ONE-TIME SETUP once the keystore exists:
  #   1. Code signing identities → Android keystores → upload it, reference
  #      name: halalmap_upload_keystore
  #   2. Play service account JSON in env group `halalmap_google_play` as
  #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Secure), invited in Play Console
  #      with "Release to testing tracks"
  # The app already has a Play upload (v0.1.0), so API publishing works
  # immediately; versionCode must stay above 2.
  # ---------------------------------------------------------------------------
  android-internal:
    name: Android (Play internal testing)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - halalmap_upload_keystore
      groups:
        - halalmap_secrets       # provides MAP_TILES_KEY
        - halalmap_google_play   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Write android/key.properties from the Codemagic keystore
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build signed .aab
        script: |
          flutter build appbundle --release \
            --dart-define=MAP_TILES_KEY=$MAP_TILES_KEY
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
